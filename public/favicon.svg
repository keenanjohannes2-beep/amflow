<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="riverFlow64" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0066ff"/>
      <stop offset="50%" style="stop-color:#00aaff"/>
      <stop offset="100%" style="stop-color:#00ccff"/>
    </linearGradient>
    <linearGradient id="letterGrad64" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <filter id="glow64" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#f0f4f8"/>
  
  <!-- A letter -->
  <text x="8" y="48" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="url(#letterGrad64)">A</text>
  
  <!-- M letter -->
  <text x="32" y="48" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="url(#letterGrad64)">M</text>
  
  <!-- River flowing through -->
  <g filter="url(#glow64)">
    <path d="M2 38 Q16 35, 28 38 T55 36 Q62 35, 64 36"
          fill="none" stroke="url(#riverFlow64)" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <path d="M2 45 Q18 48, 30 45 T58 47"
          fill="none" stroke="#00aaff" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  </g>
  
  <!-- Accent dot -->
  <circle cx="54" cy="14" r="4" fill="#00ccff" opacity="0.8"/>
</svg>
